services:
  firefly-db:
    container_name: ${APP_FIREFLY_NAME}_db
    environment:
      POSTGRES_DB: ${APP_FIREFLY_DB_DATABASE}
      POSTGRES_USER: ${APP_FIREFLY_DB_USERNAME}
      POSTGRES_PASSWORD: ${APP_FIREFLY_DB_PASSWORD}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "${APP_FIREFLY_DB_USERNAME}", "-d", "${APP_FIREFLY_DB_DATABASE}"]
      timeout: 10s
    image: postgres:18.3
    networks:
      - default
    restart: unless-stopped
    user: 999:999
    volumes:
      - ${APP_PATH_DATA}/firefly/postgres:/var/lib/postgresql

  firefly-server:
    container_name: ${APP_FIREFLY_NAME}
    depends_on:
      firefly-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      APP_ENV: local
      APP_KEY: ${APP_FIREFLY_KEY}
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: pgsql
      DB_HOST: firefly-db
      DB_PORT: 5432
      DB_DATABASE: ${APP_FIREFLY_DB_DATABASE}
      DB_USERNAME: ${APP_FIREFLY_DB_USERNAME}
      DB_PASSWORD: ${APP_FIREFLY_DB_PASSWORD}
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_ENCRYPTION: tls
      MAIL_USERNAME: ${APP_FIREFLY_SMTP_USERNAME}
      MAIL_PASSWORD: ${APP_FIREFLY_SMTP_PASSWORD}
      MAIL_FROM: ${APP_FIREFLY_SMTP_USERNAME}
      SITE_OWNER: ${APP_FIREFLY_SMTP_USERNAME}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 15s
      test: ["CMD-SHELL", "php -r \"file_get_contents('http://localhost:8080/healthcheck');\""]
      timeout: 10s
    image: fireflyiii/core:latest
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_FIREFLY_NAME}
      homepage.name: ${APP_FIREFLY_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_FIREFLY_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
      homepage.widget.type: firefly
      homepage.widget.url: http://${APP_FIREFLY_NAME}:8080
      homepage.widget.key: ${APP_FIREFLY_API}
    networks:
      - default
      - proxy-net
    restart: unless-stopped
    volumes:
      - uploads:/var/www/html/storage/upload

  firefly-cron:
    command: ["sh", "-c", "apk add tzdata && \
      (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) && \
      echo \"0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/${APP_FIREFLY_STATIC_CRON_TOKEN};echo\" \
      | crontab - && \
      crond -f -L /dev/stdout"]
    container_name: ${APP_FIREFLY_NAME}_cron
    depends_on:
      firefly-server:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      STATIC_CRON_TOKEN: ${APP_FIREFLY_STATIC_CRON_TOKEN}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test: ["CMD-SHELL", "pgrep crond"]
      timeout: 10s
    image: alpine
    networks:
      - default
    restart: unless-stopped

networks:
  proxy-net:
    external: true

volumes:
  uploads: