services:
  mkvtoolnix:
    container_name: ${APP_MKVTOOLNIX_NAME}
    environment:
      TZ: ${TZ}
      WEB_LISTENING_PORT: ${APP_MKVTOOLNIX_PORT}
      VNC_LISTENING_PORT: -1
      SUBFOLDER: /${APP_MKVTOOLNIX_NAME}/
      DARK_MODE: 1
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 15s
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:${APP_MKVTOOLNIX_PORT}/"]
      timeout: 5s
    image: jlesage/mkvtoolnix
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_MKVTOOLNIX_NAME}
      homepage.name: ${APP_MKVTOOLNIX_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_MKVTOOLNIX_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}/${APP_MKVTOOLNIX_NAME}
    networks:
      - proxy-net
    restart: unless-stopped
    volumes:
      - ${APP_PATH_DATA}/mkvtoolnix/config:/config
      - ${APP_PATH_LIBRARY}:/storage

networks:
  proxy-net:
    external: true