services:
  requestrr:
    container_name: ${APP_REQUESTRR_NAME}
    environment:
      TZ: ${TZ}
      REQUESTRR_BASEURL: ${APP_REQUESTRR_PREFIX}
    healthcheck:
      interval: 5s
      retries: 3
      start_period: 60s
      test: ["CMD-SHELL", "/bin/bash -c '0<>/dev/tcp/127.0.0.1/4545' || exit 1;"]
      timeout: 5s
    image: thomst08/requestrr:latest
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_REQUESTRR_NAME}
      homepage.name: ${APP_REQUESTRR_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_REQUESTRR_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}${APP_REQUESTRR_PREFIX}
    networks:
      - proxy-net
    restart: unless-stopped
    volumes:
      - ${APP_PATH_DATA}/servarr/requestrr:/root/config

networks:
  proxy-net:
    external: true