services:
  filebrowser:
    container_name: ${APP_FILEBROWSER_NAME}
    environment:
      TZ: ${TZ}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test: [
        "CMD-SHELL",
        "curl -f http://localhost:80/health"
      ]
      timeout: 5s
    image: gtstef/filebrowser:stable
    # labels:
    #   homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
    #   homepage.group: ${APP_FILEBROWSER_NAME}
    #   homepage.name: ${APP_FILEBROWSER_LABEL_HOMEPAGE_NAME}
    #   homepage.icon: ${APP_FILEBROWSER_LABEL_HOMEPAGE_ICON}
    #   homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
    #   homepage.widget.type: filebrowser
    #   homepage.widget.url: http://${APP_FILEBROWSER_NAME}
    #   homepage.widget.username: ${APP_FILEBROWSER_USERNAME}
    #   homepage.widget.password: ${APP_FILEBROWSER_PASSWORD}
    networks:
      - proxy-net
    restart: unless-stopped
    volumes:
      - ${APP_PATH_DATA}/filebrowser:/home/filebrowser/data
      - ${APP_PATH_FILES}:/srv

networks:
  proxy-net:
    external: true