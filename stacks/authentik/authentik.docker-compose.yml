services:
  # Database
  authentik-db:
    container_name: ${APP_AUTHENTIK_NAME}_db
    environment:
      POSTGRES_DB: ${APP_AUTHENTIK_DB_DATABASE}
      POSTGRES_USER: ${APP_AUTHENTIK_DB_USERNAME}
      POSTGRES_PASSWORD: ${APP_AUTHENTIK_DB_PASSWORD}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 5s
      test: [
        "CMD-SHELL",
        "pg_isready -U ${APP_AUTHENTIK_DB_USERNAME} -d ${APP_AUTHENTIK_DB_DATABASE}"
      ]
      timeout: 10s
    image: postgres:18
    networks:
      - default
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 60s
    user: 999:999
    volumes:
      - ${APP_PATH_DATA}/authentik/postgres:/var/lib/postgresql

  authentik-server:
    command: server
    container_name: ${APP_AUTHENTIK_NAME}
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      AUTHENTIK_HOST: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${APP_AUTHENTIK_DB_DATABASE}
      AUTHENTIK_POSTGRESQL__USER: ${APP_AUTHENTIK_DB_USERNAME}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${APP_AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${APP_AUTHENTIK_KEY}
      AUTHENTIK_EMAIL__HOST: smtp.gmail.com
      AUTHENTIK_EMAIL__PORT: 587
      AUTHENTIK_EMAIL__USE_TLS: true
      AUTHENTIK_EMAIL__USERNAME: ${APP_AUTHENTIK_SMTP_USERNAME}
      AUTHENTIK_EMAIL__PASSWORD: ${APP_AUTHENTIK_SMTP_PASSWORD}
      AUTHENTIK_EMAIL__FROM: ${APP_AUTHENTIK_SMTP_USERNAME}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 30s
      test: [
        "CMD-SHELL",
        "/lifecycle/ak healthcheck"
      ]
      timeout: 10s
    image: ghcr.io/goauthentik/server:${APP_AUTHENTIK_VERSION}
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_AUTHENTIK_NAME}
      homepage.name: ${APP_AUTHENTIK_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_AUTHENTIK_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
      homepage.widget.type: authentik
      homepage.widget.version: 2
      homepage.widget.url: http://${APP_AUTHENTIK_NAME}:9000
      homepage.widget.key: ${APP_AUTHENTIK_API}
    networks:
      - default
      - proxy-net
    ports:
      - ${APP_AUTHENTIK_PORT_HTTP:-9000}:9000
      - ${APP_AUTHENTIK_PORT_HTTPS:-9443}:9443
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - ${APP_PATH_DATA}/authentik/data:/data
      - ${APP_PATH_DATA}/authentik/templates:/templates

  authentik-worker:
    command: worker
    container_name: ${APP_AUTHENTIK_NAME}_worker
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      AUTHENTIK_HOST: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: ${APP_AUTHENTIK_DB_DATABASE}
      AUTHENTIK_POSTGRESQL__USER: ${APP_AUTHENTIK_DB_USERNAME}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${APP_AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${APP_AUTHENTIK_KEY}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 15s
      test: [
        "CMD-SHELL",
        "/lifecycle/ak healthcheck"
      ]
      timeout: 10s
    image: ghcr.io/goauthentik/server:${APP_AUTHENTIK_VERSION}
    networks:
      - default
      - proxy-net
    restart: unless-stopped
    shm_size: 512mb
    user: root
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${APP_PATH_DATA}/authentik/data:/data
    - ${APP_PATH_DATA}/authentik/certs:/certs
    - ${APP_PATH_DATA}/authentik/templates:/templates

networks:
  proxy-net:
    external: true