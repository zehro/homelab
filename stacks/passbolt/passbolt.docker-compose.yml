services:
  passbolt-db:
    container_name: ${APP_PASSBOLT_NAME}_db
    environment:
      MARIADB_DATABASE: ${APP_PASSBOLT_DB_DATABASE}
      MARIADB_USER: ${APP_PASSBOLT_DB_USERNAME}
      MARIADB_PASSWORD: ${APP_PASSBOLT_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${APP_PASSBOLT_DB_ROOT_PASSWORD}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 15s
      test: ["CMD-SHELL", "mariadb-admin --user=root --host=127.0.0.1 --port=3306 --password=${APP_PASSBOLT_DB_ROOT_PASSWORD} ping"]
      timeout: 5s
    image: mariadb:12.2.2
    networks:
      - default
    restart: unless-stopped
    user: 999:999
    volumes:
      - ${APP_PATH_DATA}/passbolt/mariadb:/var/lib/mysql
         
  passbolt-server:
    container_name: ${APP_PASSBOLT_NAME}
    depends_on:
      passbolt-db:
        condition: service_healthy
    environment:
      APP_DEFAULT_TIMEZONE: ${TZ}
      APP_FULL_BASE_URL: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
      # When initiating Passbolt, run 'gpg --list-keys' via terminal.
      # Copy the fingerprint from '[ultimate] Passbolt default user'
      PASSBOLT_GPG_SERVER_KEY_FINGERPRINT: ${APP_PASSBOLT_FINGERPRINT}
      PASSBOLT_SSL_FORCE: true
      PASSBOLT_SECURITY_PROXIES_ACTIVE: true
      GNUPGHOME: ${APP_PASSBOLT_GNUPGHOME}
      PASSBOLT_GPG_SERVER_KEY_PRIVATE: ${APP_PASSBOLT_GPGHOME}/serverkey_private.asc
      PASSBOLT_GPG_SERVER_KEY_PUBLIC: ${APP_PASSBOLT_GPGHOME}/serverkey.asc
      DATASOURCES_DEFAULT_HOST: passbolt-db
      DATASOURCES_DEFAULT_PORT: 3306
      DATASOURCES_DEFAULT_DATABASE: ${APP_PASSBOLT_DB_DATABASE}
      DATASOURCES_DEFAULT_USERNAME: ${APP_PASSBOLT_DB_USERNAME}
      DATASOURCES_DEFAULT_PASSWORD: ${APP_PASSBOLT_DB_PASSWORD}
      DATASOURCES_ROOT_PASSWORD: ${APP_PASSBOLT_DB_ROOT_PASSWORD}
    healthcheck:
      interval: 60s
      retries: 3
      start_period: 60s
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthcheck/status.json"]
      timeout: 30s
    image: passbolt/passbolt:5.13.0-1-ce-non-root
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_PASSBOLT_NAME}
      homepage.name: ${APP_PASSBOLT_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_PASSBOLT_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
    networks:
      - proxy-net
      - default
    ports:
      # - ${APP_PORT_HTTP:-8080}:80
      # - ${APP_PORT_HTTPS:-8443}:443
      # Alternatively for non-root images:
      - ${APP_PORT_HTTP:-8081}:8080
      - ${APP_PORT_HTTPS:-8444}:4433
    restart: unless-stopped
    user: 33:33
    volumes:
      - /run/systemd/timesync:/run/systemd/timesync:ro
      - ${APP_PATH_DATA}/passbolt/gnupg:${APP_PASSBOLT_GNUPGHOME}
      - ${APP_PATH_DATA}/passbolt/gpg:${APP_PASSBOLT_GPGHOME}
      - ${APP_PATH_DATA}/passbolt/jwt:${APP_PASSBOLT_JWTHOME}

networks:
  proxy-net:
    external: true