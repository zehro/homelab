services:
  tdarr:
    container_name: ${APP_TDARR_NAME}
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      serverIP: 0.0.0.0
      serverPort: ${APP_TDARR_SERVER_PORT:-8266}
      webUIPort: ${APP_TDARR_UI_PORT:-8265}
      internalNode: false
      inContainer: true
      apiKey: ${APP_TDARR_API_KEY}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: ["CMD", "curl", "-f", "http://localhost:8265/api/v2/status"]
      timeout: 10s
    image: ghcr.io/haveagitgat/tdarr:latest
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_TDARR_NAME}
      homepage.name: ${APP_TDARR_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_TDARR_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
    networks:
      - proxy-net
    ports:
      - ${APP_TDARR_SERVER_PORT:-8266}:8266
      - ${APP_TDARR_UI_PORT:-8265}:8265
    restart: unless-stopped
    volumes:
      - ${APP_PATH_DATA}/servarr/tdarr/server:/app/server
      - ${APP_PATH_DATA}/servarr/tdarr/configs:/app/configs
      - ${APP_PATH_DATA}/servarr/tdarr/logs:/app/logs
      - ${APP_PATH_DATA}/servarr/tdarr/transcode_cache:/temp
      - ${APP_PATH_LIBRARY}:/media

networks:
  proxy-net:
    external: true