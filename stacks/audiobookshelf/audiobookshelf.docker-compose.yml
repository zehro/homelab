services:
  # Audiobooks, Podcasts
  audiobookshelf:
    container_name: ${APP_ABS_NAME}
    environment:
      TZ: ${TZ}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 15s
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:80/healthcheck"]
      timeout: 5s
    image: ghcr.io/advplyr/audiobookshelf:latest
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_ABS_NAME}
      homepage.name: ${APP_ABS_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_ABS_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}/audiobookshelf
      homepage.widget.type: audiobookshelf
      homepage.widget.url: http://${APP_ABS_NAME}:80
      homepage.widget.key: ${APP_ABS_API}
    networks:
      - proxy-net
    ports:
      - ${APP_ABS_PORT:-13378}:80
    restart: unless-stopped
    volumes:
      - ${APP_PATH_DATA}/audiobookshelf/config:/config
      - ${APP_PATH_DATA}/audiobookshelf/metadata:/metadata
      - ${APP_PATH_LIBRARY}/Audiobooks:/audiobooks
      - ${APP_PATH_LIBRARY}/Podcasts:/podcasts

networks:
  proxy-net:
    external: true