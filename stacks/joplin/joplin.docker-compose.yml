services:
  # Database
  joplin-db:
    container_name: ${APP_JOPLIN_NAME}_db
    environment:
      POSTGRES_DB: ${APP_JOPLIN_DB_DATABASE}
      POSTGRES_USER: ${APP_JOPLIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${APP_JOPLIN_DB_PASSWORD}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test: ["CMD", "pg_isready", "-U", "${APP_JOPLIN_DB_USERNAME}", "-d", "${APP_JOPLIN_DB_DATABASE}"]
      timeout: 10s
    image: postgres:18
    networks:
      - default
    restart: unless-stopped
    user: 999:999
    volumes:
      - ${APP_PATH_DATA}/joplin/postgres:/var/lib/postgresql

  joplin-server:
    container_name: ${APP_JOPLIN_NAME}
    depends_on:
      joplin-db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      APP_BASE_URL: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
      MAILER_ENABLED: 1
      MAILER_HOST: smtp.gmail.com
      MAILER_PORT: 587
      MAILER_SECURITY: starttls
      MAILER_AUTH_USER: ${APP_JOPLIN_SMTP_USERNAME}
      MAILER_AUTH_PASSWORD: ${APP_JOPLIN_SMTP_PASSWORD}
      MAILER_NOREPLY_NAME: Joplin Server
      MAILER_NOREPLY_EMAIL: ${APP_JOPLIN_SMTP_USERNAME}
      DB_CLIENT: pg
      POSTGRES_HOST: joplin-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${APP_JOPLIN_DB_DATABASE}
      POSTGRES_USER: ${APP_JOPLIN_DB_USERNAME}
      POSTGRES_PASSWORD: ${APP_JOPLIN_DB_PASSWORD}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: ["CMD-SHELL", "test -f /proc/1/status"]
      timeout: 10s
    image: joplin/server:latest
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_JOPLIN_NAME}
      homepage.name: ${APP_JOPLIN_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_JOPLIN_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
    networks:
      - default
      - proxy-net
    restart: unless-stopped

networks:
  proxy-net:
    external: true