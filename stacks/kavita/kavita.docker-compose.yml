services:
  kavita:
    container_name: ${APP_KAVITA_NAME}
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 15s
      test: ["CMD", "curl", "-f", "http://localhost:${APP_KAVITA_PORT}/api/health"]
      timeout: 5s
    image: lscr.io/linuxserver/kavita:latest
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_KAVITA_NAME}
      homepage.name: ${APP_KAVITA_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_KAVITA_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
      homepage.widget.type: ${APP_KAVITA_NAME}
      homepage.widget.url: http://${APP_KAVITA_NAME}:${APP_KAVITA_PORT}
      homepage.widget.key: ${APP_KAVITA_API}
    networks:
      - proxy-net
    restart: unless-stopped
    volumes:
      - ${APP_PATH_DATA}/kavita/config:/config
      - ${APP_PATH_LIBRARY}:/data
      - ${APP_PATH_LIBRARY_NSFW}:/data/NSFW

networks:
  proxy-net:
    external: true