services:
  jdownloader2:
    container_name: jdownloader
    environment:
      TZ: ${TZ}
      USER_ID: ${PUID}
      GROUP_ID: ${PGID}
      EXT_LISTENING_PORT: 3129
      WEB_LISTENING_PORT: ${APP_JDOWNLOADER_PORT:-5800}
      VNC_LISTENING_PORT: -1
      MYJDOWNLOADER_DEVICE_NAME: ${APP_JDOWNLOADER_DEVICE}
      MYJDOWNLOADER_EMAIL: ${APP_JDOWNLOADER_USERNAME}
      MYJDOWNLOADER_PASSWORD: ${APP_JDOWNLOADER_PASSWORD}
      JDOWNLOADER_HEADLESS: 0
      DARK_MODE: 1
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test: ["CMD-SHELL", "pgrep -f JDownloader"]
      timeout: 10s
    image: jlesage/jdownloader-2
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: jdownloader
      homepage.name: ${APP_JDOWNLOADER_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_JDOWNLOADER_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}/jdownloader
      homepage.widget.type: jdownloader
      homepage.widget.client: ${APP_JDOWNLOADER_DEVICE}
      homepage.widget.username: ${APP_JDOWNLOADER_USERNAME}
      homepage.widget.password: ${APP_JDOWNLOADER_PASSWORD}
    networks:
      - proxy-net
    ports:
      - 3129:3129
    restart: unless-stopped
    volumes:
      - ${APP_PATH_DATA}/jdownloader:/config
      - ${APP_PATH_LIBRARY}/downloads/jdownloader:/output
      - ${APP_PATH_LIBRARY_NSFW}/downloads/jdownloader:/output/NSFW

networks:
  proxy-net:
    external: true