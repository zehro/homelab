services:
  stash:
    container_name: ${APP_STASH_NAME}
    environment:
      STASH_BLOBS: /blobs/
      STASH_CACHE: /cache/
      STASH_GENERATED: /generated/
      STASH_METADATA: /metadata/
      STASH_STASH: /data/
      STASH_PORT: ${APP_STASH_PORT}
    healthcheck:
      interval: 15s
      retries: 3
      start_period: 15s
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:${APP_STASH_PORT}"]
      timeout: 3s
    image: stashapp/stash:latest
    labels:
      homepage.server: ${APP_LABEL_HOMEPAGE_SERVER:-docker-server}
      homepage.group: ${APP_STASH_NAME}
      homepage.name: ${APP_STASH_LABEL_HOMEPAGE_NAME}
      homepage.icon: ${APP_STASH_LABEL_HOMEPAGE_ICON}
      homepage.href: https://${APP_URL_SUBDOMAIN}${APP_URL_DOMAIN}
      homepage.widget.type: stash
      homepage.widget.url: http://${APP_STASH_NAME}:${APP_STASH_PORT}
      homepage.widget.key: ${APP_STASH_API}
    networks:
      - proxy-net
    restart: unless-stopped
    volumes:
      - ${APP_PATH_DATA}/stash/config:/root/.stash
      - ${APP_PATH_DATA}/stash/blobs:/blobs
      - ${APP_PATH_DATA}/stash/cache:/cache
      - ${APP_PATH_DATA}/stash/generated:/generated
      - ${APP_PATH_DATA}/stash/metadata:/metadata
      - ${APP_PATH_LIBRARY}:/data

networks:
  proxy-net:
    external: true